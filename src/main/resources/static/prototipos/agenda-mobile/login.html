<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Smile Agenda</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="login-body">
    <div class="phone-shell">
      <main class="screen login-screen">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <span>Smile</span>
            <h1>Agenda</h1>
          </div>
        </div>

        <section class="welcome-card">
          <p class="eyebrow">Bem-vindo</p>
          <h2>Entre na sua conta</h2>

          <form id="loginForm" class="login-form">
            <label class="field">
              <span>E-mail</span>
              <input id="email" type="email" value="paciente@clinica.com" required />
            </label>

            <label class="field">
              <span>Senha</span>
              <input id="password" type="password" value="123456" required />
            </label>

            <div class="extra-row">
              <label class="check-row">
                <input type="checkbox" checked />
                <span>Lembrar</span>
              </label>
              <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" class="primary-btn">Entrar</button>
          </form>

          <p class="demo-user">Demo: paciente@clinica.com / 123456</p>
        </section>
      </main>
    </div>

    <script src="login.js"></script>
  </body>
</html>

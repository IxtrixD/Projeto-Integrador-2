<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="topbar">
        <div>
          <p class="section-label">Minha conta</p>
          <h1>Perfil</h1>
        </div>
      </header>

      <main class="screen app-screen">
        <section class="profile-card">
          <div class="avatar">MO</div>
          <h2 id="profileName">Maria Oliveira</h2>
          <p id="profileEmail">paciente@clinica.com</p>
        </section>

        <section class="info-card">
          <div class="info-row">
            <span>Telefone</span>
            <strong id="profilePhone">(11) 9 8765-4321</strong>
          </div>
          <div class="info-row">
            <span>CPF</span>
            <strong id="profileCpf">123.456.789-00</strong>
          </div>
          <div class="info-row">
            <span>Plano</span>
            <strong id="profilePlan">Plano Silver</strong>
          </div>
        </section>

        <button class="primary-btn block" id="logoutBtnProfile">Sair da conta</button>
      </main>

      <nav class="bottom-nav">
        <a class="nav-item" href="consultas-marcadas.html">
          <span>🗓️</span>
          <small>Agenda</small>
        </a>
        <a class="nav-item" href="consultas-disponiveis.html">
          <span>📅</span>
          <small>Disponíveis</small>
        </a>
        <a class="nav-item active" href="perfil.html">
          <span>👤</span>
          <small>Perfil</small>
        </a>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>

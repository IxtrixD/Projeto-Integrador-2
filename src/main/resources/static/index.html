<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="./JS/theme.js"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/theme.css">
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <main class="container">
        <p class="brand-mark">✦ UnitOdonto</p>
        <h1>Bem-vindo</h1>
        <p class="login-subtitle">Acesse sua área de cuidados odontológicos.</p>

        <form id="loginForm" class="login-form" action="/login" method="POST">
            <div class="login-container">
                <input type="text" name="username" placeholder="Usuário" autocomplete="username" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="login-container">
                <input type="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                <button class="password-toggle" type="button" aria-label="Mostrar senha" aria-pressed="false">
                    <i class="bx bxs-lock-alt" aria-hidden="true"></i>
                </button>
            </div>

            <div class="remember-container">
                <label>
                    <input type="checkbox"> Lembrar Senha
                </label>
            </div>

            <button type="submit">Entrar</button>
        </form>
        <p id="loginError" role="alert" hidden></p>

        <div class="forgot-password-container">
            <p>Esqueceu sua senha? <a href="forgot-password.html">Recupere aqui</a></p>
        </div>

        <div class="register-container">
            <p>Não tem uma conta? <a href="register.html">Registre-se aqui</a></p>
        </div>
    </main>
    <script src="./JS/login.js"></script>
</body>
</html>
